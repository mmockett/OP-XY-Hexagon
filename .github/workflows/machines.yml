name: Machine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Each synth against the SDK the Open-XY builder ships catalog machines with:
  # its records, browser preview, drawing checks and host sound tests. The
  # native compile needs the pinned Blackfin tools, which this Linux runner
  # doesn't have.
  machines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hexagon
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: staging
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Machine source, preview and sound checks
        run: |
          for machine in wane bloom hollow orbit bend moth; do
            python open-xy/sdk.py test --machine "hexagon/$machine" --cxx clang++ --host-cxx g++ || exit 1
          done
